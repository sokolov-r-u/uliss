[versions]
kotlin = "2.3.21"
java = "25"
java-compile = "25"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
# CVE fixes over the Spring Boot BOM (BOM properties set in io.uliss.kotlin-conventions); drop at Boot >= 4.1.2
tomcat = "11.0.27"
jackson = "3.1.8"
jackson2 = "2.21.8"
fasterxml-uuid-generator = "5.2.0"
node-gradle = "7.1.0"
wiremock = "3.13.2"
jqwik = "1.10.2"

# protoc and the gRPC codegen plugin: keep equal to protobuf-java and grpc-* in the Spring Boot BOM (runtime)
protobuf = "4.34.2"
grpc = "1.80.0"
protobufPlugin = "0.9.6"
tomcat-annotations = "6.0.53"
jib = "3.5.4"
spring-ai = "2.0.1"
pgvector = "0.1.6"
jacoco = "0.8.15"


[libraries]
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
jqwik-kotlin = { module = "net.jqwik:jqwik-kotlin", version.ref = "jqwik" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
fasterxml-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "fasterxml-uuid-generator" }

kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
jib-gradle-plugin = { module = "com.google.cloud.tools:jib-gradle-plugin", version.ref = "jib" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
protobuf-java = { module = "com.google.protobuf:protobuf-java" }

spring-ai-starter-deepseek = { module = "org.springframework.ai:spring-ai-starter-model-deepseek", version.ref = "spring-ai" }
spring-ai-starter-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai", version.ref = "spring-ai" }
pgvector = { module = "com.pgvector:pgvector", version.ref = "pgvector" }
tomcat-annotations-api = { module = "org.apache.tomcat:annotations-api", version.ref = "tomcat-annotations" }

protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobufPlugin" }

[plugins]
node = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
