# to make urls work correctly follow the instruction in etc.hosts or resolve hostnames
POSTGRES_USER=postgres
POSTGRES_PASSWORD=postgres
POSTGRES_DB=uliss
POSTGRES_URL=jdbc:postgresql://postgres:5432/uliss
# public = browser-facing (authorize + issuer), internal = service-to-service (token/revoke/jwks)
AUTH_PUBLIC_URL=http://auth.uliss.local:9000
AUTH_INTERNAL_URL=http://auth.uliss.local:9000
ALLOWED_CORS_URLS=*
AUTH_SECURE_COOKIE=false

# client credentials
APP_CLIENTS_M2M_CLIENT_ID=uliss-internal
APP_CLIENTS_M2M_CLIENT_SECRET=password

# ports
USER_SERVER_PORT=8080
AUTH_SERVER_PORT=9000
USER_GRPC_PORT=9090
NOTE_SERVER_PORT=8081

# user-service
USER_SERVICE_URL=http://user
USER_SERVICE_HOST=localhost

# note-service
NOTE_SERVICE_URL=http://note
# AI (Spring AI / DeepSeek). Leave key empty until a DeepSeek key is available.
DEEPSEEK_API_KEY=
DEEPSEEK_MODEL=deepseek-v4-flash

# frontend
FRONTEND_URL=http://uliss.local:3000
# all allowed OAuth callbacks (local + k8s), comma-separated
AUTH_CLIENT_CALLBACK_URLS=http://uliss.local:3000/callback,http://uliss.local/callback
FRONTEND_CLIENT_ID=uliss-web
FRONTEND_CLIENT_SECRET=password
