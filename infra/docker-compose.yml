# JVM services log JSON to stdout (Dozzle) and to infra/volumes/logs (gitignored).
x-file-logging: &file-logging
  LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash
  LOGGING_STRUCTURED_FORMAT_FILE: logstash
  LOGGING_STRUCTURED_JSON_EXCLUDE: "@version,level_value"
  LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: 10MB
  LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY: "7"
  LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP: 1GB
  LOGGING_LOGBACK_ROLLINGPOLICY_CLEAN_HISTORY_ON_START: "true"

# Browser-facing auth goes through the web nginx (TLS); services call auth inside the Compose network.
x-auth-urls: &auth-urls
  AUTH_PUBLIC_URL: https://auth.uliss.home
  AUTH_INTERNAL_URL: http://auth:9000

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    #    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-uliss}
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      # loopback only: host-based bootRun reaches it, other machines do not
      - "127.0.0.1:5432:5432"
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 20s
      retries: 10

  # Log viewer for all containers: http://localhost:8888
  dozzle:
    image: amir20/dozzle:v11.1.3
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8080"

  # Images are pre-built, not built by compose: ./gradlew buildAllImages
  auth:
    image: uliss/auth:latest
    #    restart: always
    profiles: [ "full" ]
    env_file: .env
    environment:
      # auth's own container, not localhost as in host-based bootRun
      USER_SERVICE_HOST: user
      # web is served over HTTPS in full-compose mode, not the Vite dev port :3000
      FRONTEND_URL: https://uliss.home
      AUTH_CLIENT_CALLBACK_URLS: https://uliss.home/callback
      AUTH_SECURE_COOKIE: "true"
      <<: [ *auth-urls, *file-logging ]
      LOGGING_FILE_NAME: /logs/auth.log
      # no .gz suffix: archives stay plain text so IDE/grep can search them
      LOGGING_LOGBACK_ROLLINGPOLICY_FILE_NAME_PATTERN: /logs/archive/auth-%d{yyyy-MM-dd}.%i.log
    ports:
      # loopback only, for debugging; browsers reach auth through the web nginx
      - "127.0.0.1:9000:9000"
    volumes:
      - ./volumes/logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      user:
        condition: service_healthy

  user:
    image: uliss/user:latest
    #    restart: always
    profiles: [ "full" ]
    env_file: .env
    environment:
      # web is served over HTTPS in full-compose mode, not the Vite dev port :3000
      FRONTEND_URL: https://uliss.home
      AUTH_SECURE_COOKIE: "true"
      <<: [ *auth-urls, *file-logging ]
      LOGGING_FILE_NAME: /logs/user.log
      # no .gz suffix: archives stay plain text so IDE/grep can search them
      LOGGING_LOGBACK_ROLLINGPOLICY_FILE_NAME_PATTERN: /logs/archive/user-%d{yyyy-MM-dd}.%i.log
    ports:
      - "8080:8080"
      # gRPC on loopback only (host-based bootRun auth); containers use the Compose network
      - "127.0.0.1:9090:9090"
    volumes:
      - ./volumes/logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  note:
    image: uliss/note:latest
    #    restart: always
    profiles: [ "full" ]
    env_file: .env
    environment:
      FRONTEND_URL: https://uliss.home
      AUTH_SECURE_COOKIE: "true"
      <<: [ *auth-urls, *file-logging ]
      LOGGING_FILE_NAME: /logs/note.log
      # no .gz suffix: archives stay plain text so IDE/grep can search them
      LOGGING_LOGBACK_ROLLINGPOLICY_FILE_NAME_PATTERN: /logs/archive/note-%d{yyyy-MM-dd}.%i.log
    ports:
      - "8081:8081"
    volumes:
      - ./volumes/logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: uliss/web:latest
    #    restart: always
    profiles: [ "full" ]
    environment:
      # TLS variant of the nginx config; the image default is plain HTTP (k8s, TLS at the Ingress)
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-tls
    ports:
      # :80 only redirects to https
      - "80:80"
      - "443:443"
    volumes:
      # TLS certificate from infra/tls/generate-certs.sh (gitignored); nginx does not start without it
      - ./volumes/tls:/etc/nginx/tls:ro
    healthcheck:
      # 127.0.0.1: busybox resolves localhost to ::1, where nginx does not listen
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      note:
        condition: service_healthy