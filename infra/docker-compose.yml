services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    #    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-uliss}
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 20s
      retries: 10

  # Images are pre-built, not built by compose: ./gradlew :auth:jibDockerBuild :user:jibDockerBuild
  # :note:jibDockerBuild, and docker build -t uliss/web:latest -f module/web/Dockerfile .
  auth:
    image: uliss/auth:latest
    #    restart: always
    profiles: [ "full" ]
    env_file: .env
    environment:
      # auth's own container, not localhost as in host-based bootRun
      USER_SERVICE_HOST: user
    ports:
      - "9000:9000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      # same hostname resolves from the host browser (via infra/etc.hosts) and from sibling
      # containers, so AUTH_PUBLIC_URL/AUTH_INTERNAL_URL need no override here
      default:
        aliases:
          - auth.uliss.local
    depends_on:
      postgres:
        condition: service_healthy
      user:
        condition: service_healthy

  user:
    image: uliss/user:latest
    #    restart: always
    profiles: [ "full" ]
    env_file: .env
    environment:
      # web is served on :80 in full-compose mode, not the Vite dev port :3000
      FRONTEND_URL: http://uliss.local
    ports:
      - "8080:8080"
      - "9090:9090"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  note:
    image: uliss/note:latest
    #    restart: always
    profiles: [ "full" ]
    env_file: .env
    environment:
      FRONTEND_URL: http://uliss.local
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: uliss/web:latest
    #    restart: always
    profiles: [ "full" ]
    ports:
      - "80:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost/ || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      note:
        condition: service_healthy