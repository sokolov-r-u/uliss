apiVersion: v1
kind: Secret
metadata:
  name: uliss-secret
# k8s-only overrides on top of infra/.env (ingress on :80, in-cluster DNS)
stringData:
  POSTGRES_URL: "jdbc:postgresql://host.minikube.internal:5432/uliss"
  AUTH_PUBLIC_URL: "http://auth.uliss.local"
  AUTH_INTERNAL_URL: "http://auth:9000"
  FRONTEND_URL: "http://uliss.local"
