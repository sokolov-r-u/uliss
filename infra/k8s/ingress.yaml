apiversion: networking.k8s.io/v1
kind: ingress
metadata:
  name: ingress-uliss-host
spec:
  rules:
    - host: "auth.uliss.local"
      http:
        paths:
          - pathtype: prefix
            path: "/"
            backend:
              service:
                name: auth
                port:
                  number: 9000
    - host: "user.uliss.local"
      http:
        paths:
          - pathtype: prefix
            path: "/"
            backend:
              service:
                name: user
                port:
                  number: 8080
