apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-uliss-host
spec:
  rules:
    - host: "auth.uliss.local"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: auth
                port:
                  number: 9000
    - host: "user.uliss.local"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: user
                port:
                  number: 8080
    - host: "uliss.local"
      http:
        paths:
          # same-origin: SPA calls relative /oauth2 and /users -> user-service
          - pathType: Prefix
            path: "/oauth2"
            backend:
              service:
                name: user
                port:
                  number: 8080
          - pathType: Prefix
            path: "/users"
            backend:
              service:
                name: user
                port:
                  number: 8080
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: web
                port:
                  number: 80
