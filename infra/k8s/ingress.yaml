apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-uliss-host
spec:
  rules:
    - host: "auth.uliss.local"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: auth
                port:
                  number: 9000
    - host: "user.uliss.local"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: user
                port:
                  number: 8080
    - host: "note.uliss.local"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: note
                port:
                  number: 8081
    - host: "uliss.local"
      http:
        paths:
          # same-origin: SPA calls relative /user/* -> user-service (oauth2 mediator + profile),
          # /note/* -> note-service. Each service's whole path space starts with its own name
          # (WebMvcPathPrefixConfig on the backend).
          - pathType: Prefix
            path: "/user"
            backend:
              service:
                name: user
                port:
                  number: 8080
          - pathType: Prefix
            path: "/note"
            backend:
              service:
                name: note
                port:
                  number: 8081
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: web
                port:
                  number: 80
