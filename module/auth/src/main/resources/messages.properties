# Registration form field errors, resolved by Spring message codes (<constraint>.<form>.<field>).
# The constraint annotations keep their API codes (EMAIL_FORMAT_ERROR, PASSWORD_FORMAT_ERROR) as default messages.
Pattern.registerForm.email=Enter a valid email address.
Pattern.registerForm.password=Use at least 10 characters with an uppercase letter, a lowercase letter, a digit, and one of #?!@$%^&*-.
Password.registerForm.password=The passphrase is too long: at most 72 Latin characters.
