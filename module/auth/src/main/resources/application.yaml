server:
  port: ${AUTH_SERVER_PORT:9000}
  # behind the compose web nginx (TLS): build redirects from X-Forwarded-Proto/Host
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # the filter does not reach Tomcat's session cookie, so Secure is set explicitly
        secure: ${AUTH_SECURE_COOKIE:false}

spring:
  application:
    name: auth
  config:
    # noinspection SpringBootApplicationYaml
    import:
      - classpath:database.yml
      - classpath:exception.yml
      - classpath:monitoring.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL}?currentSchema=auth
  flyway:
    schemas: auth
    default-schema: auth
  jpa:
    properties:
      hibernate:
        default_schema: auth
  thymeleaf:
    cache: false   #todo dev: always re-render templates; enable in prod

app:
  # where a login without a saved authorize request goes
  frontend-url: ${FRONTEND_URL}
  auth:
    issuer: ${AUTH_PUBLIC_URL}
    authorization-cleanup:
      cron: ${AUTH_AUTHORIZATION_CLEANUP_CRON:0 0 3 * * *}   # daily, server time
  cors:
    allowed-origins: ${AUTH_ALLOWED_CORS_URLS:http://localhost:3000}
  clients:
    authorization-code:
      client-id: ${FRONTEND_CLIENT_ID}
      client-secret: ${FRONTEND_CLIENT_SECRET}
      callback-urls: ${AUTH_CLIENT_CALLBACK_URLS:${FRONTEND_URL}/callback}
      # pages the end-session endpoint may return to after sign-out
      post-logout-urls: ${AUTH_CLIENT_POST_LOGOUT_URLS:${FRONTEND_URL}/signed-out}

    m2m:
      client-id: ${APP_CLIENTS_M2M_CLIENT_ID}
      client-secret: ${APP_CLIENTS_M2M_CLIENT_SECRET}

grpc:
  user-service:
    host: ${USER_SERVICE_HOST}
    port: ${USER_GRPC_PORT}
    # Login blocks on this call; fail closed instead of hanging.
    deadline: ${USER_GRPC_DEADLINE:3s}

# pre-production: LoggingAspect traces io.uliss calls at DEBUG; set LOG_LEVEL_ULISS=info before production
logging:
  level:
    io.uliss: ${LOG_LEVEL_ULISS:info}
