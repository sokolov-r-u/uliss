<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-store"/>
  <title th:text="${title}">Uliss</title>
  <link rel="stylesheet" th:href="@{/ds/styles.css}"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
    }
    body {
      background: var(--bg-deep);
      color: var(--cream);
      font-family: var(--font-text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Stage — one continuous deep field ─────────────── */
    .auth-stage {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 74px 24px 48px;
    }

    .auth-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .auth-layer--wash {
      background: var(--amb-wash);
    }

    .auth-layer--sky svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .auth-layer--sink {
      background: linear-gradient(180deg,
      rgba(5, 8, 12, 0) 30%, rgba(5, 8, 12, .55) 52%, var(--bg-deep) 72%);
    }

    .auth-layer--tex {
      mix-blend-mode: overlay;
      opacity: var(--tex-opacity, .5);
      background-image: var(--texture-craquelure);
      background-size: 300px;
    }

    /* ── Column ────────────────────────────────────────── */
    .auth-col {
      position: relative;
      width: 100%;
      max-width: 436px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wordmark {
      font-family: var(--font-display);
      font-weight: var(--w-wordmark);
      font-size: 58px;
      line-height: .9;
      letter-spacing: var(--tracking-wordmark);
      color: var(--wordmark-fill);
    }

    .tagline {
      margin-top: 11px;
      font-size: 9.5px;
      letter-spacing: 3.4px;
      text-transform: uppercase;
      color: var(--wordmark-login);
    }

    .auth-form-col {
      width: 100%;
      margin-top: 74px;
    }

    /* ── Tabs (client-side switch) ─────────────────────── */
    .auth-tabs {
      display: flex;
      border: 1px solid var(--line-strong);
      margin-bottom: 18px;
    }
    .auth-tab {
      flex: 1;
      height: 44px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--cream);
      opacity: .55;
      font-family: var(--font-text);
      font-size: 11px;
      font-weight: var(--w-ui);
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity var(--dur-hover) var(--ease), background var(--dur-hover) var(--ease);
    }

    .auth-tab:hover {
      opacity: .82;
    }
    .auth-tab.is-active {
      border-bottom-color: var(--accent);
      background: var(--bg-surface);
      opacity: 1;
      font-weight: var(--w-emphasis);
    }

    .tab-panel--off { display: none; }

    .auth-body {
      display: flex;
      flex-direction: column;
    }

    /* ── Heading ───────────────────────────────────────── */
    .auth-heading {
      margin: 7px 0 22px;
      font-family: var(--heading-font, var(--font-text));
      font-size: var(--heading-size, 18px);
      font-weight: var(--w-emphasis);
      line-height: var(--leading-title);
      color: var(--text-muted);
      text-wrap: balance;
    }

    /* ── Fields ────────────────────────────────────────── */
    .field { margin-bottom: 15px; }

    .field-label {
      display: block;
      margin-bottom: 7px;
      font-size: 8.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .field-box {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 46px;
      padding: 0 14px;
      background: var(--bg-panel);
      border: 1px solid var(--field-border, var(--line-strong));
      transition: border-color var(--dur-hover) var(--ease), box-shadow var(--dur-hover) var(--ease);
    }
    .field-box:focus-within {
      border-color: var(--accent);
      box-shadow: var(--glow-accent);
    }

    .field-box.has-error {
      border-color: var(--terracotta);
    }
    .field-box input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      background: transparent;
      color: var(--cream);
      font-family: var(--font-text);
      font-size: 13px;
      letter-spacing: .5px;
    }
    .field-box input::placeholder { color: var(--text-faint); }
    .field-box input:focus { outline: none; }
    .field-error {
      margin: 6px 0 0;
      font-size: 10px;
      color: var(--terracotta);
    }
    .eye {
      display: flex;
      flex-shrink: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }
    .eye:hover { color: var(--cream-dim); }

    /* ── Forgot row (inactive; register reserves the space) ── */
    .field-aux {
      display: flex;
      justify-content: flex-end;
      margin: 4px 0 20px;
    }

    .field-aux--reserved {
      visibility: hidden;
    }
    .field-aux .muted {
      font-size: 10px;
      letter-spacing: .5px;
      color: var(--text-muted);
      cursor: not-allowed;
    }

    /* ── CTA ───────────────────────────────────────────── */
    .auth-button {
      width: 100%;
      height: 50px;
      border: 1px solid var(--cta-border, var(--accent-edge));
      background: var(--cta-bg, var(--accent));
      color: var(--cta-fg, var(--bg-deep));
      font-family: var(--font-text);
      font-size: 11px;
      font-weight: var(--cta-weight, var(--w-emphasis));
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--cta-shadow, none);
      transition: filter var(--dur-hover) var(--ease);
    }

    .auth-button:hover {
      filter: brightness(1.06);
    }

    /* ── Divider ───────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 17px 0;
    }
    .divider span { flex: 1; height: 1px; background: var(--line); }

    .divider em {
      font-style: normal;
      font-size: 8.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-faint);
    }

    /* ── SSO row — visually present, backend has none ──── */
    .sso-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .sso-btn {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--wordmark-login);
      font-family: var(--font-text);
      font-size: 10px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      cursor: not-allowed;
      opacity: .5;
    }

    .sso-btn .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid var(--text-muted);
    }

    /* ── Notices ───────────────────────────────────────── */
    .auth-note {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-left: 2px solid var(--line-strong);
      background: var(--bg-panel);
      font-size: 11px;
      color: var(--cream-dim);
      animation: uNoticeIn var(--dur-notice) var(--ease-notice) both;
    }

    .auth-note--ok {
      border-left-color: var(--accent);
    }
    .auth-note--err { border-left-color: var(--terracotta); color: var(--cream); }

    /* ── Responsive ────────────────────────────────────── */
    @media (max-width: 640px) {
      .auth-stage {
        padding: 44px 24px 40px;
      }

      .wordmark {
        font-size: 44px;
      }

      .auth-form-col {
        margin-top: 40px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .starfield circle {
        animation: none !important;
      }

      .auth-note {
        animation: none;
      }
    }
  </style>
</head>
<body>
<!--/* Single auth page. active = 'signin' | 'register' — the initially open tab.
       Both forms live in the DOM; switching is client-side (no reload). */-->
<div class="auth-stage" data-accent="ochre"
     data-ground="obsidian" data-surface="login" th:fragment="page(active)">
  <div class="auth-layer auth-layer--wash"></div>
  <div class="auth-layer auth-layer--sky" th:insert="~{fragments/starfield :: starfield}"></div>
  <div class="auth-layer auth-layer--sink"></div>

  <div class="auth-col">
    <span class="wordmark">Uliss</span>
    <span class="tagline">Voice journal</span>

    <div class="auth-form-col" th:attr="data-active=${active}">
      <nav class="auth-tabs">
        <button class="auth-tab" data-tab="signin" th:classappend="${active == 'signin'} ? 'is-active'"
                type="button">Sign in
        </button>
        <button class="auth-tab" data-tab="register" th:classappend="${active == 'register'} ? 'is-active'"
                type="button">Register
        </button>
      </nav>

      <!-- ── Sign in ───────────────────────────────────── -->
      <div class="tab-panel" data-panel="signin"
           th:classappend="${active == 'register'} ? 'tab-panel--off'">
        <form class="auth-body" method="post" novalidate th:action="@{/login}">
          <h1 class="auth-heading">Return to your sky</h1>

          <div class="auth-note auth-note--ok" th:if="${param.registered}">
            Account created. Sign in below.
          </div>
          <div class="auth-note" th:if="${param.logout}">
            You have signed out.
          </div>
          <div class="auth-note auth-note--err" th:if="${param.error}">
            Wrong email or passphrase.
          </div>

          <div class="field">
            <label class="field-label" for="username">Email</label>
            <div class="field-box">
              <input autocomplete="email" id="username" name="username" placeholder="wayfarer@uliss.app"
                     required type="email"/>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="password">Passphrase</label>
            <div class="field-box">
              <input autocomplete="current-password" id="password" name="password" placeholder="your passphrase"
                     required type="password"/>
              <button aria-label="Show passphrase" class="eye" data-toggle="password" type="button">
                <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.6" viewBox="0 0 24 24" width="18">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="field-aux">
            <span class="muted" title="Coming soon">Forgot passphrase?</span>
          </div>

          <button class="auth-button" type="submit">Enter</button>
          <div class="divider"><span></span><em>or</em><span></span></div>
          <div class="sso-row">
            <button class="sso-btn" disabled title="Coming soon" type="button">
              <svg fill="none" height="12" stroke="currentColor" stroke-linecap="square" stroke-width="1.7"
                   viewBox="0 0 24 24" width="12">
                <path d="M4 6h16v12H4zM4 7l8 6 8-6"/>
              </svg>
              Link
            </button>
            <button class="sso-btn" disabled title="Coming soon" type="button">
              <span class="dot"></span>Apple
            </button>
            <button class="sso-btn" disabled title="Coming soon" type="button">
              <span class="dot"></span>Google
            </button>
          </div>
        </form>
      </div>

      <!-- ── Register ──────────────────────────────────── -->
      <div class="tab-panel" data-panel="register"
           th:classappend="${active == 'signin'} ? 'tab-panel--off'">
        <form class="auth-body" method="post" novalidate th:action="@{/register}" th:object="${registerForm}">
          <h1 class="auth-heading">Trace your first star</h1>

          <div class="auth-note auth-note--err" th:if="${#fields.hasAnyErrors()}">
            Please fix the highlighted fields.
          </div>

          <div class="field">
            <label class="field-label" for="email">Email</label>
            <div class="field-box" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
              <input autocomplete="email" id="email" placeholder="you@uliss.app" required
                     th:field="*{email}" type="email"/>
            </div>
            <p class="field-error" th:errors="*{email}" th:if="${#fields.hasErrors('email')}">Email error</p>
          </div>

          <div class="field">
            <label class="field-label" for="reg-password">Passphrase</label>
            <div class="field-box" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
              <input autocomplete="new-password" id="reg-password" placeholder="choose a passphrase" required
                     th:field="*{password}" type="password"/>
              <button aria-label="Show passphrase" class="eye" data-toggle="reg-password" type="button">
                <svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                     stroke-width="1.6" viewBox="0 0 24 24" width="18">
                  <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <p class="field-error" th:errors="*{password}" th:if="${#fields.hasErrors('password')}">Password error</p>
          </div>

          <!--/* Reserves the vertical space the "Forgot passphrase?" row takes on the
                 Sign-in tab, so Begin and Enter sit at the same height. */-->
          <div aria-hidden="true" class="field-aux field-aux--reserved">
            <span class="muted">Forgot passphrase?</span>
          </div>

          <button class="auth-button" type="submit">Begin</button>
          <div class="divider"><span></span><em>or</em><span></span></div>
          <div class="sso-row">
            <button class="sso-btn" disabled title="Coming soon" type="button">
              <svg fill="none" height="12" stroke="currentColor" stroke-linecap="square" stroke-width="1.7"
                   viewBox="0 0 24 24" width="12">
                <path d="M4 6h16v12H4zM4 7l8 6 8-6"/>
              </svg>
              Link
            </button>
            <button class="sso-btn" disabled title="Coming soon" type="button">
              <span class="dot"></span>Apple
            </button>
            <button class="sso-btn" disabled title="Coming soon" type="button">
              <span class="dot"></span>Google
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="auth-layer auth-layer--tex"></div>

  <script>
    (function () {
      var col = document.querySelector('.auth-form-col');
      if (!col) return;

      function focusFirst(name) {
        var f = col.querySelector('.tab-panel[data-panel="' + name + '"] input:not([type=hidden])');
        if (f) f.focus();
      }

      function switchTab(name) {
        col.querySelectorAll('.auth-tab').forEach(function (t) {
          t.classList.toggle('is-active', t.dataset.tab === name);
        });
        col.querySelectorAll('.tab-panel').forEach(function (p) {
          p.classList.toggle('tab-panel--off', p.dataset.panel !== name);
        });
        try { history.replaceState(null, '', name === 'register' ? '/register' : '/login'); } catch (e) {}
        focusFirst(name);
      }

      col.querySelectorAll('[data-tab]').forEach(function (el) {
        el.addEventListener('click', function () { switchTab(el.dataset.tab); });
      });

      document.querySelectorAll('.eye[data-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = document.getElementById(btn.getAttribute('data-toggle'));
          if (input) input.type = input.type === 'password' ? 'text' : 'password';
        });
      });

      focusFirst(col.getAttribute('data-active') || 'signin');
    })();
  </script>
</div>
</body>
</html>
