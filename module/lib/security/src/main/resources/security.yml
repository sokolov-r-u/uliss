spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_INTERNAL_URL}/oauth2/jwks
          # validates "iss" only; keys still come from jwk-set-uri, no discovery request
          issuer-uri: ${AUTH_PUBLIC_URL}
          # user tokens are issued to the web client; other tokens of the same issuer are refused
          audiences: ${FRONTEND_CLIENT_ID}

security:
  oauth2:
    client:
      authorization-code:
        client-id: ${FRONTEND_CLIENT_ID}
        client-secret: ${FRONTEND_CLIENT_SECRET}
      redirect-uri: ${FRONTEND_URL}/callback
      post-logout-redirect-uri: ${FRONTEND_URL}/signed-out
      auth-server-public-url: ${AUTH_PUBLIC_URL}
      auth-server-internal-url: ${AUTH_INTERNAL_URL}
      secure-cookie: ${AUTH_SECURE_COOKIE}
  cors:
    allowed-origins: ${ALLOWED_CORS_URLS}
    allowed-headers: "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    register: "/**"