spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          issuer-uri: http://localhost:9000
          # user tokens are issued to the web client; other tokens of the same issuer are refused
          audiences: test-web-client

security:
  oauth2:
    client:
      authorization-code:
        client-id: test-web-client
        client-secret: test-web-secret
      redirect-uri: http://localhost:3000/callback
      post-logout-redirect-uri: http://localhost:3000/signed-out
      auth-server-public-url: http://localhost:9000
      auth-server-internal-url: http://localhost:9000
      secure-cookie: false
  cors:
    allowed-origins: http://localhost:3000
    allowed-headers: "*"
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
    register: "/**"