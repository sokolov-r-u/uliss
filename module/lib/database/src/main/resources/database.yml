spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${uliss.database.pool.maximum-size:${DB_POOL_MAX_SIZE:10}}
      minimum-idle: ${uliss.database.pool.minimum-idle:${DB_POOL_MIN_IDLE:10}}
      # fail a request after 5 s without a free connection instead of Hikari's 30 s
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
#          plan_cache_max_size: 4096
#          native_sql_plan_cache_max_size: 1024
  flyway:
    enabled: true
