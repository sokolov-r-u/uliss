server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # hashed assets are immutable
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry document must never be cached
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # same-origin routing for full docker-compose (no ingress there); inert under k8s, where
    # Ingress routes /user and /note straight to those services before traffic reaches this pod
    location /user/ {
        proxy_pass http://user:8080/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /note/ {
        proxy_pass http://note:8081/note/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # client-side routing: unknown paths fall back to the SPA
    location / {
        try_files $uri /index.html;
    }
}
