server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # hashed assets are immutable
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry document must never be cached
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # client-side routing: unknown paths fall back to the SPA
    location / {
        try_files $uri /index.html;
    }
}
