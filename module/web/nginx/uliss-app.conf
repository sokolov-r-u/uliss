# SPA and same-origin API routing, included by the canonical-host server of both template variants.
root /usr/share/nginx/html;
index index.html;

# hashed assets are immutable
location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA entry document must never be cached
location = /index.html {
    add_header Cache-Control "no-store";
}

# same-origin routing for full docker-compose (no ingress there); inert under k8s, where
# Ingress routes /user and /note straight to those services before traffic reaches this pod
location /user/ {
    proxy_pass http://user:8080/user/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # overwrite, not append: a client-sent value must not reach a future rate limit or audit
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /note/ {
    proxy_pass http://note:8081/note/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # overwrite, not append: a client-sent value must not reach a future rate limit or audit
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # dictation uploads; note-service refuses recordings over 10 MB itself
    client_max_body_size 12m;

    # Chat message POST responses are SSE (text/event-stream); nginx's default response
    # buffering would hold tokens back until the buffer fills or the stream ends
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

# client-side routing: unknown paths fall back to the SPA
location / {
    try_files $uri /index.html;
}
