server:
  port: 8080

spring:
  application:
    name: user-service
  config:
    import:
      - classpath:database-test.yml
      - classpath:exception.yml
      - classpath:security-test.yml
  threads:
    virtual:
      enabled: true
  grpc:
    server:
      # Random port so tests don't clash with a running user-service on 9090
      port: 0
  flyway:
    schemas: profile
    default-schema: profile
    locations: classpath:db/migration
    create-schemas: true
uliss:
  web:
    path-prefix: /user
