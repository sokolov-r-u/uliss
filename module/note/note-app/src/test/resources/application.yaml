server:
  port: 8081

spring:
  application:
    name: note-service
  config:
    # noinspection SpringBootApplicationYaml
    import:
      - classpath:database-test.yml
      - classpath:exception.yml
      - classpath:security-test.yml
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 120s
  flyway:
    schemas: note
    default-schema: note
    locations: classpath:db/migration
    create-schemas: true
  ai:
    retry:
      max-attempts: 2
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      api-key: test
    openai:
      api-key: test
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
        timeout: 60s
        max-retries: 1
    vectorstore:
      pgvector:
        schema-name: note
        dimensions: 1536
        initialize-schema: false

# Long enough that the poller never fires during a test's lifetime - it's not what's under test
# in most full-context tests, and a tick mid-test would add unrelated DB activity/flakiness.
note:
  outbox:
    poll-interval-ms: 3600000
    max-attempts: 3
    concurrency: 4
    lease-safety-factor: 1.3
