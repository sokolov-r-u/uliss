server:
  port: 8081

spring:
  application:
    name: note-service
  config:
    # noinspection SpringBootApplicationYaml
    import:
      - classpath:database-test.yml
      - classpath:exception.yml
      - classpath:security-test.yml
  threads:
    virtual:
      enabled: true
  flyway:
    schemas: note
    default-schema: note
    locations: classpath:db/migration
    create-schemas: true
  ai:
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      api-key: test
    openai:
      api-key: test
      embedding:
        model: text-embedding-3-small
        dimensions: 1536
    vectorstore:
      pgvector:
        schema-name: note
        dimensions: 1536
        initialize-schema: false
