server:
  port: ${NOTE_SERVER_PORT:8081}

spring:
  application:
    name: note-service
  config:
    # noinspection SpringBootApplicationYaml
    import:
      - classpath:database.yml
      - classpath:exception.yml
      - classpath:security.yml
      - classpath:monitoring.yml
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 120s
  datasource:
    url: ${POSTGRES_URL}?currentSchema=note
  flyway:
    schemas: note
    default-schema: note
  ai:
    retry:
      max-attempts: 2
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 1536
        timeout: 60s
        max-retries: 1
    vectorstore:
      pgvector:
        schema-name: note
        dimensions: 1536
        initialize-schema: false

note:
  rag:
    chunk-size: 800
  outbox:
    poll-interval-ms: 1000
    max-attempts: 3
    concurrency: 4
    lease-safety-factor: 1.3
