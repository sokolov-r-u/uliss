server:
  port: ${NOTE_SERVER_PORT:8081}

spring:
  application:
    name: note-service
  config:
    # noinspection SpringBootApplicationYaml
    import:
      - classpath:database.yml
      - classpath:exception.yml
      - classpath:security.yml
      - classpath:monitoring.yml
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 120s
  servlet:
    multipart:
      # backstop above note.speech.max-file-size, which answers with its own code
      max-file-size: 11MB
      max-request-size: 11MB
  datasource:
    url: ${POSTGRES_URL}?currentSchema=note
  flyway:
    schemas: note
    default-schema: note
  ai:
    retry:
      max-attempts: 2
    model:
      chat: openai
      embedding: openai
    # Inactive; switching back also requires removing the OpenAI per-call options (see README).
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-5.6-luna}
        # OutboxLeasePolicy derives the summary lease from these; keep it within 6 minutes.
        timeout: 60s
        max-retries: 2
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 1536
        timeout: 30s
        max-retries: 1
      audio:
        transcription:
          model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-transcribe}
          timeout: 120s
          max-retries: 1
uliss:
  web:
    path-prefix: /note
  database:
    pool:
      maximum-size: ${NOTE_DB_POOL_MAX_SIZE:8}
      minimum-idle: ${NOTE_DB_POOL_MIN_IDLE:1}
note:
  status-stream:
    # open note status streams per user (each polls the database every second)
    max-per-user: ${NOTE_STATUS_STREAMS_PER_USER:5}
  rag:
    chunk-size: 800
  assistant:
    # Chat Completions rejects function tools with any other effort on gpt-5.6 (TECH_DEBT: Responses API).
    reasoning-effort: none
    verbosity: low
    notes-search:
      top-k: 5
      # A short query scores lower than note-to-note; top-k and the model do the selection.
      min-similarity: 0.30
      max-calls-per-turn: 3
  summary:
    retrieval-query-max-chars: 8000
    retrieval-top-k: 5
    # Same-topic notes measured 0.46-0.69, other topics 0.27-0.45 (DECISIONS 2026-10-16).
    retrieval-min-similarity: 0.50
    reasoning-effort: medium
    verbosity: low
  ai-edit:
    reasoning-effort: low
    # low verbosity invites the model to shorten a note it should only edit
    verbosity: medium
  speech:
    # the browser stops recording here; gpt-4o-transcribe truncation on longer files is unverified
    max-duration: 5m
    max-file-size: 10MB
  outbox:
    poll-interval-ms: 1000
    max-attempts: 3
    concurrency: 4
    lease-safety-factor: 1.3

# pre-production: LoggingAspect traces io.uliss calls at DEBUG; set LOG_LEVEL_ULISS=info before production
logging:
  level:
    io.uliss: ${LOG_LEVEL_ULISS:info}
    # outbox polls every second; its call tracing drowns the rest. LOG_LEVEL_OUTBOX=debug to see it
    "[io.uliss.note_service.outbox]": ${LOG_LEVEL_OUTBOX:info}
    "[io.uliss.note_service.repository.OutboxEventRepository]": ${LOG_LEVEL_OUTBOX:info}
    # full model requests (system prompt, history, RAG chunks) and responses; LOG_LEVEL_AI=debug to see them
    "[org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor]": ${LOG_LEVEL_AI:info}
