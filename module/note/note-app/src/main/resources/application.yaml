server:
  port: ${NOTE_SERVER_PORT:8081}

spring:
  application:
    name: note-service
  config:
    # noinspection SpringBootApplicationYaml
    import:
      - classpath:database.yml
      - classpath:exception.yml
      - classpath:security.yml
      - classpath:monitoring.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POSTGRES_URL}?currentSchema=note
  flyway:
    schemas: note
    default-schema: note
  ai:
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: 1536
    vectorstore:
      pgvector:
        schema-name: note
        dimensions: 1536
        initialize-schema: false

note:
  outbox:
    poll-interval-ms: 5000
    # Visibility timeout for a claimed (PROCESSING) event - ~4x poll-interval-ms, so a worker that
    # crashed after claim() but before process() completed gets re-claimed instead of stuck forever.
    processing-timeout-ms: 20000
