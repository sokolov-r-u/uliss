name: Build and publish images

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Log in to GHCR
        id: ghcr
        uses: ./.github/actions/ghcr-login

      # gradle.properties is gitignored (machine-specific docker.executable path); jib (registry
      # push, unlike jibDockerBuild) never invokes it, so the example's placeholder value is fine.
      - name: Set up gradle.properties for Jib
        run: cp gradle.properties.example gradle.properties

      - name: Build and test
        run: ./gradlew build

      - name: Push auth/user/note images
        run: >
          ./gradlew :auth:jib :user:jib :note:jib
          -Pdocker.registry=${{ steps.ghcr.outputs.registry-path }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: module/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ghcr.outputs.registry-path }}/web:latest
