name: Build and publish base JRE image

on:
  push:
    branches: [ main ]
    paths: [ "infra/docker/base-jre/**" ]
  workflow_dispatch: { }

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: "25.0.3_9"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        id: ghcr
        uses: ./.github/actions/ghcr-login

      - name: Build and push base-jre image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/base-jre
          file: infra/docker/base-jre/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.ghcr.outputs.registry-path }}/base-jre:${{ env.IMAGE_TAG }}
