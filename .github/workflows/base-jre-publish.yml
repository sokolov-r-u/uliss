name: Build and publish base JRE image

on:
  push:
    branches: [ main ]
    paths: [ "infra/docker/base-jre/**" ]
  workflow_dispatch: { }

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: "25.0.3_9"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute registry path
        id: registry
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "path=${REGISTRY}/${owner}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base-jre image
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/base-jre
          file: infra/docker/base-jre/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.registry.outputs.path }}/base-jre:${{ env.IMAGE_TAG }}
