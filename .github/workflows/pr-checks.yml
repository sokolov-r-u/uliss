name: PR checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # gradle.properties is gitignored; docker.jre.version/docker.executable are read at Gradle
      # configuration time by io.uliss.docker-conventions.gradle.kts, so even a plain `build`
      # fails without it (Jib itself is never invoked here).
      - name: Set up gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: Build and unit test
        run: ./gradlew build

      # Separate invocation: integrationTest is deliberately not wired into build/check
      # (kept Docker-independent), so it must be requested explicitly.
      - name: Integration test
        run: ./gradlew integrationTest

      # Separate invocation: jacocoRootReport has no dependsOn integrationTest (same reason
      # above), so ordering must come from invocation order, not the task graph. if: always() so a
      # failed build/test still merges whatever coverage data was written before the failure.
      - name: Merge coverage report
        if: always()
        run: ./gradlew jacocoRootReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: build/reports/jacoco/jacocoRootReport/
          retention-days: 14

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck design system
        run: npm run typecheck -w @uliss/design-system

      - name: Test design system
        run: npm run test -w @uliss/design-system

      - name: Typecheck web
        run: npm run typecheck -w @uliss/web

      - name: Test web
        run: npm run test -w @uliss/web

      - name: Build web
        run: npm run build -w @uliss/web

  visual-checks:
    runs-on: ubuntu-latest
    container:
      # keep in step with @playwright/test in module/web/package.json (scripts/playwright-docker.sh reads it there)
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test web visuals and interactions
        run: npm run visual:test:container -w @uliss/web
        env:
          CI: "true"

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: module/web/visual/test-results/
          retention-days: 14
