# Two monthly PRs: one for CI actions (merge when green), one for every app dependency (review by hand).
version: 2
multi-ecosystem-groups:
  app-dependencies:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: app-dependencies
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: app-dependencies
  - package-ecosystem: docker
    directories:
      - /module/web
      - /infra/docker/base-jre
    patterns: ["*"]
    multi-ecosystem-group: app-dependencies
    # Move to the next Java LTS by hand.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/ghcr-login
    schedule:
      interval: monthly
    groups:
      ci-actions:
        patterns: ["*"]
