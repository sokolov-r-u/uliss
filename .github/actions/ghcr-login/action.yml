name: GHCR login
description: Compute the lowercased GHCR registry path and log in

outputs:
  registry-path:
    description: "ghcr.io/<lowercased-owner>"
    value: ${{ steps.registry.outputs.path }}

runs:
  using: composite
  steps:
    - name: Compute registry path
      id: registry
      shell: bash
      run: |
        owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "path=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
